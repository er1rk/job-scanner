name: probe-cv
on:
  push:
    branches: ["probe/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: python -u probe_cv.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
