name: Daily job scan

on:
  # GitHub delays or silently drops scheduled runs, especially at the top of the hour.
  # Main run off the full hour + a backup run that does nothing if the main one already ran that day.
  schedule:
    - cron: "23 6 * * *"     # main:   every day 06:23 UTC (07:23 Warsaw in winter, 08:23 in summer)
    - cron: "47 8 * * *"     # backup: every day 08:47 UTC - skipped if today's main run happened
    - cron: "13 8 * * 0"     # Sunday weekly report: 08:13 UTC (09:13 Warsaw in winter) - no scanning
    - cron: "41 10 * * 0"    # Sunday backup: skipped if the report was already sent
  workflow_dispatch:         # "Run workflow" button for manual runs
    inputs:
      hours:
        description: "Offers posted within the last N hours (72 = 3 days)"
        default: "24"
      min_score:
        description: "Minimum score to include in the e-mail"
        default: "60"
      ignore_seen:
        description: "Re-score offers already seen before"
        type: boolean
        default: false
      attach_csv:
        description: "Attach the full dataset (jobs.csv) to the e-mail"
        type: boolean
        default: false
      send_report:
        description: "Also send the weekly market & skill-gap report"
        type: boolean
        default: false

# Never run two scans at once: both would restore the same database and the later save would overwrite
# the earlier one. A second run waits for the first.
concurrency:
  group: job-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Offline tests
        run: python -m unittest -q

      # One-off migration: restore the old seen.json cache (if any) so already-scored
      # offers are not scored again. Harmless once the database exists.
      - uses: actions/cache/restore@v4
        with:
          path: data/seen.json
          key: seen-legacy
          restore-keys: seen-

      # The database is cached ONLY encrypted (key in the DB_ENCRYPTION_KEY secret).
      # A new cache entry is saved after every run; the newest one is restored next time.
      - uses: actions/cache@v4
        with:
          path: data/jobs.db.enc
          key: jobdb-enc-${{ github.run_id }}
          restore-keys: jobdb-enc-

      - name: Scan and score offers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          PRIVATE_CONFIG: ${{ secrets.PRIVATE_CONFIG }}
          DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          HOURS: ${{ inputs.hours }}
          MIN_SCORE: ${{ inputs.min_score }}
          IGNORE_SEEN: ${{ inputs.ignore_seen }}
          ATTACH_CSV: ${{ inputs.attach_csv }}
          SEND_REPORT: ${{ inputs.send_report }}
          BACKUP_RUN: ${{ github.event.schedule == '47 8 * * *' || github.event.schedule == '41 10 * * 0' }}
          REPORT_ONLY: ${{ github.event.schedule == '13 8 * * 0' || github.event.schedule == '41 10 * * 0' }}
        run: python scanner.py
