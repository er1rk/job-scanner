name: Daily job scan

on:
  schedule:
    - cron: "0 7 * * 1-5"   # Mon–Fri 07:00 UTC (08:00 Warsaw in winter, 09:00 in summer)
  workflow_dispatch:         # "Run workflow" button for manual runs
    inputs:
      hours:
        description: "Offers posted within the last N hours (72 = 3 days)"
        default: "24"
      min_score:
        description: "Minimum score to include in the e-mail"
        default: "60"
      ignore_seen:
        description: "Re-score offers already seen before"
        type: boolean
        default: false
      attach_csv:
        description: "Attach the full dataset (jobs.csv) to the e-mail"
        type: boolean
        default: false
      send_report:
        description: "Also send the weekly market & skill-gap report"
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Offline tests
        run: python -m unittest -q

      # One-off migration: restore the old seen.json cache (if any) so already-scored
      # offers are not scored again. Harmless once the database exists.
      - uses: actions/cache/restore@v4
        with:
          path: data/seen.json
          key: seen-legacy
          restore-keys: seen-

      # The database lives in the Actions cache (private - not visible in the public repo).
      # A new cache entry is saved after every run; the newest one is restored next time.
      - uses: actions/cache@v4
        with:
          path: data/
          key: jobdb-${{ github.run_id }}
          restore-keys: jobdb-

      - name: Scan and score offers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          HOURS: ${{ inputs.hours }}
          MIN_SCORE: ${{ inputs.min_score }}
          IGNORE_SEEN: ${{ inputs.ignore_seen }}
          ATTACH_CSV: ${{ inputs.attach_csv }}
          SEND_REPORT: ${{ inputs.send_report }}
        run: python scanner.py
