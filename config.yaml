# PUBLIC DEFAULTS. The real search settings live in the PRIVATE_CONFIG secret (or a local,
# git-ignored config.private.yaml) and replace these keys - see config.private.example.yaml.

# Every keyword is searched in every location below (+ remote in the country, if enabled).
keywords:
  - "data analyst"

locations:
  - "Warsaw, Poland"

include_remote_poland: true

# Portals to search (see sources/). Remove one to switch it off.
sources: [linkedin, pracuj, nofluffjobs, justjoin, rocketjobs]

# Only offers posted in the last N hours
posted_within_hours: 24

# How many result pages (25 offers each) to read per search
pages_per_search: 1

# If not empty: keep only offers whose title contains at least one of these words (case- and
# accent-insensitive). Useful for portals that match keywords loosely (e.g. pracuj.pl).
include_title_keywords: []

# Skip offers whose title contains any of these words (case-insensitive) before calling the AI
exclude_title_keywords:
  - senior
  - lead
  - head of
  - director
  - manager
  - principal
  - intern
  - internship
  - trainee
  - student
  - staż
  - stażyst
  - praktyk

# AI pre-filter: before the detailed scoring, Gemini sees only titles (batches of triage_batch_size per call)
# and drops clear mismatches. Keeps everything if a call fails. Set to false to switch off.
triage: true
triage_batch_size: 60

# Max offers scored per run (Gemini calls). Offers over the cap are queued and scored first on the
# next run, so nothing is lost. ~150 offers take ~20 minutes and fit the free tier.
max_offers_per_run: 150

# Stop scoring after this many minutes and queue the rest, so a slow day never hits the 60-minute job
# timeout (a timed-out job saves nothing). The weekly report shows how often this happens.
time_budget_minutes: 40

# Queued offers older than this are dropped (they are usually closed by then)
queue_max_age_days: 7

# Offers scoring at least this much are e-mailed
min_score_to_notify: 60

# Categories Gemini sorts offers into (set your own in the private config)
role_categories: ["data/analytics", "finance", "operations", "engineering", "sales/marketing", "other"]

# Gemini model (if unavailable, the script picks an available Flash model automatically)
gemini_model: "gemini-flash-lite-latest"

# Approximate exchange rates used to compare salaries in PLN/month (update occasionally)
fx_to_pln:
  PLN: 1
  EUR: 4.25
  USD: 3.70
  GBP: 4.95
  CHF: 4.55

# Attach the full dataset (jobs.csv) to the e-mail on these weekdays (0 = Monday ... 6 = Sunday)
attach_csv_weekdays: [0]

# Send the weekly market & skill-gap report on these weekdays (0 = Monday). It covers the last 7 days
# and carries the CSV attachment on that day.
report_weekdays: [0]
