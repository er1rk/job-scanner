# Every keyword is searched in every location below (+ remote in Poland).
keywords:
  - "data analyst"
  - "reporting analyst"
  - "business analyst"
  - "BI analyst"
  - "data quality analyst"
  - "AML analyst"
  - "KYC analyst"
  - "fraud analyst"
  - "risk analyst"
  - "compliance analyst"
  - "financial crime"
  - "trust and safety"
  - "brand protection"
  - "payments analyst"
  - "operations analyst"
  - "sales analyst"

locations:
  - "Warsaw, Poland"
  - "Poznań, Poland"
  - "Łódź, Poland"
  - "Szczecin, Poland"

include_remote_poland: true

# Only offers posted in the last N hours
posted_within_hours: 24

# How many result pages (25 offers each) to read per search
pages_per_search: 1

# Skip offers whose title contains any of these words (case-insensitive) before calling the AI
exclude_title_keywords:
  - senior
  - lead
  - head of
  - director
  - manager
  - principal
  - intern
  - internship
  - trainee
  - student
  - staż
  - stażyst
  - praktyk

# Safety cap on AI calls per run
max_offers_per_run: 80

# Offers scoring at least this much are e-mailed
min_score_to_notify: 60

# Gemini model (if unavailable, the script picks an available Flash model automatically)
gemini_model: "gemini-flash-lite-latest"
